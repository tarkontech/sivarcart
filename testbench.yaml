laravel: '@testbench'

providers:
  - SivarcartCore\SivarcartCore\SivarcartCoreServiceProvider
  - Rmirandasv\Wompi\WompiServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

# The credentials of the workbench are fake ones: they only let the webhook of
# Wompi be signed and verified while developing. The workbench never talks to
# the real Wompi API.
env:
  - WOMPI_CLIENT_ID=workbench-client-id
  - WOMPI_CLIENT_SECRET=workbench-client-secret
  - WOMPI_TOKEN_CACHE_STORE=array

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

# The migrations published in the skeleton of the workbench are purged before
# every build. "vendor:publish" never overwrites a file that already exists,
# so without the purge a build would keep running the migrations that the
# package already removed.
purge:
  files:
    - database/migrations/*

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - vendor-publish:
        --tag: sivarcart-core-migrations
    - migrate-fresh
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
